version: 2
updates:
  - package-ecosystem: docker
    directories:
      - "/8.2"
      - "/8.3"
      - "/8.4"
      - "/8.5"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Indian/Mauritius
    groups:
      docker-images:
        group-by: dependency-name
    ignore:
      - dependency-name: php
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      - dependency-name: composer
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Indian/Mauritius
    groups:
      weekly-maintenance:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
