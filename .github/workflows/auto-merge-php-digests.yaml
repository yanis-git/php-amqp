name: Auto-merge PHP digest updates

on:
  workflow_run:
    workflows: [Validate and publish Docker images]
    types: [completed]

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-php-digests
  cancel-in-progress: false

jobs:
  merge:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.pull_requests[0] != null
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify and merge the Dependabot pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          VALIDATED_HEAD_SHA: ${{ github.event.workflow_run.pull_requests[0].head.sha }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          set -euo pipefail

          pr_json=$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER")
          author=$(jq -r '.user.login' <<<"$pr_json")
          state=$(jq -r '.state' <<<"$pr_json")
          base_ref=$(jq -r '.base.ref' <<<"$pr_json")
          base_sha=$(jq -r '.base.sha' <<<"$pr_json")
          head_sha=$(jq -r '.head.sha' <<<"$pr_json")

          test "$author" = 'dependabot[bot]'
          test "$state" = 'open'
          test "$base_ref" = 'main'
          test "$head_sha" = "$VALIDATED_HEAD_SHA"

          jobs_json=$(gh api --paginate --slurp \
            "repos/$REPOSITORY/actions/runs/$RUN_ID/jobs?filter=latest&per_page=100")
          jq -e '
            [.[].jobs[]
              | select(.name | test("^Validate PHP (8\\.2|8\\.3|8\\.4|8\\.5) image$"))
              | {name, conclusion}
            ] as $jobs
            | ($jobs | length) == 4
              and ([$jobs[].name] | unique | length) == 4
              and ([$jobs[].conclusion] | all(. == "success"))
          ' <<<"$jobs_json"

          files_json=$(gh api --paginate --slurp \
            "repos/$REPOSITORY/pulls/$PR_NUMBER/files?per_page=100")
          jq -e '
            [.[].[] | .filename] as $files
            | ($files | length) > 0
              and ([$files[] | select(test("^8\\.[2-5]/Dockerfile$") | not)] | length) == 0
          ' <<<"$files_json"

          git fetch --no-tags origin "$base_sha" "$head_sha"
          merge_base=$(git merge-base "$base_sha" "$head_sha")
          .github/scripts/validate-php-digest-update.sh "$merge_base" "$head_sha"

          merge_json=$(gh api --method PUT "repos/$REPOSITORY/pulls/$PR_NUMBER/merge" \
            -f merge_method=squash \
            -f sha="$head_sha")
          jq -e '.merged == true' <<<"$merge_json"

          gh api --method POST "repos/$REPOSITORY/actions/workflows/publish.yaml/dispatches" \
            -f ref=main
