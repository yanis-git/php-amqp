name: Validate and publish Docker images

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: php-amqp-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name == 'pull_request'
    name: Validate PHP ${{ matrix.php_version }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php_version: [8.2, 8.3, 8.4, 8.5]
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Build image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ./${{ matrix.php_version }}
          file: ./${{ matrix.php_version }}/Dockerfile
          load: true
          push: false
          provenance: false
          tags: php-amqp-validation:${{ matrix.php_version }}

      - name: Smoke test image
        run: |
          set -euo pipefail
          image="php-amqp-validation:${{ matrix.php_version }}"
          docker run --rm "$image" sh -ceu '
            test "$(php -r "echo PHP_MAJOR_VERSION . \".\" . PHP_MINOR_VERSION;")" = "${{ matrix.php_version }}"
            for extension in amqp imagick bcmath exif gd intl pdo_mysql zip; do
              php -m | grep -Fxq "$extension"
            done
            composer --version
            php --ri amqp | grep -Fq "AMQP protocol version"
            config_dir="$(convert -list configure | awk '\''$1 == "CONFIGURE_PATH" { print $2; exit }'\'' | cut -d: -f1)"
            test -s "$config_dir/policy.xml"
            grep -Fq '\''domain="delegate" rights="none" pattern="HTTPS"'\'' "$config_dir/policy.xml"
          '

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: Push PHP ${{ matrix.php_version }} image to Docker Hub
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php_version: [8.2, 8.3, 8.4, 8.5]
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
        with:
          platforms: linux/amd64,linux/arm64

      - name: Log in to Docker Hub
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          platforms: linux/amd64,linux/arm64
          context: ./${{ matrix.php_version }}
          file: ./${{ matrix.php_version }}/Dockerfile
          push: true
          provenance: false
          tags: yanisdocaxess/php-amqp:${{ matrix.php_version }}
