name: Validate and publish Docker images

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 1 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: php-amqp-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name == 'pull_request'
    name: Validate PHP ${{ matrix.php_version }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php_version: [8.2, 8.3, 8.4, 8.5]
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./${{ matrix.php_version }}
          file: ./${{ matrix.php_version }}/Dockerfile
          load: true
          push: false
          provenance: false
          tags: php-amqp-validation:${{ matrix.php_version }}

      - name: Smoke test image
        run: |
          set -euo pipefail
          image="php-amqp-validation:${{ matrix.php_version }}"
          docker run --rm "$image" sh -ceu '
            test "$(php -r "echo PHP_MAJOR_VERSION . \".\" . PHP_MINOR_VERSION;")" = "${{ matrix.php_version }}"
            for extension in amqp imagick bcmath exif gd intl pdo_mysql zip; do
              php -m | grep -Fxq "$extension"
            done
            composer --version
            php --ri amqp | grep -Fq "AMQP protocol version"
            config_dir="$(convert -list configure | awk '\''$1 == "CONFIGURE_PATH" { print $2; exit }'\'' | cut -d: -f1)"
            test -s "$config_dir/policy.xml"
            grep -Fq '\''domain="delegate" rights="none" pattern="HTTPS"'\'' "$config_dir/policy.xml"
          '

  publish:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    name: Push PHP ${{ matrix.php_version }} image to Docker Hub
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php_version: [8.2, 8.3, 8.4, 8.5]
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          platforms: linux/amd64,linux/arm64

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          platforms: linux/amd64,linux/arm64
          context: ./${{ matrix.php_version }}
          file: ./${{ matrix.php_version }}/Dockerfile
          pull: ${{ github.event_name == 'schedule' }}
          no-cache: ${{ github.event_name == 'schedule' }}
          push: true
          provenance: false
          tags: yanisdocaxess/php-amqp:${{ matrix.php_version }}
